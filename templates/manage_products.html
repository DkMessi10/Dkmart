<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - DK MART</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header class="header">

    <div class="logo">
        <span class="dk">DK</span>
        <span class="mart">MART</span>
    </div>

    <div class="header-icons">
        <a href="/admin">Dashboard</a>
        <a href="/">Home</a>
        <a href="/logout">Logout</a>
    </div>

</header>

<section class="featured">

    <h2>🛠 Manage Products</h2>

    <div style="text-align:right; margin-bottom:20px;">

    <a href="/add_product" class="shop-btn">
        ➕ Add New Product
    </a>

</div>

    <table class="product-table">

        <tr>
            <th>ID</th>
            <th>Image</th>
            <th>Name</th>
            <th>Price</th>
            <th>Category</th>
            <th>Action</th>
        </tr>

        {% for product in products %}

        <tr>

            <td>{{ product[0] }}</td>

            <td>
                <img src="{{ url_for('static', filename=product[3]) }}" width="70">
            </td>

            <td>{{ product[1] }}</td>

            <td>₹{{ product[2] }}</td>

            <td>{{ product[5] }}</td>

            <td>
                <a href="/edit_product/{{ product[0] }}" class="edit-btn">
                    ✏️ Edit
                </a>

                <a href="/delete_product/{{ product[0] }}" class="delete-btn"
                   onclick="return confirm('Delete this product?')">
                    ❌ Delete
                </a>
            </td>

        </tr>

        {% endfor %}

    </table>

</section>

</body>

</html>
