<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - DK MART</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header class="header">

    <div class="logo">
        <span class="dk">DK</span>
        <span class="mart">MART</span>
    </div>

    <div class="header-icons">
        <a href="/">Home</a>
        <a href="/products">Products</a>
        <a href="/categories">Categories</a>
        <a href="/cart">Cart</a>
    </div>

</header>

<nav class="navbar">

    <a href="/">Home</a>
    <a href="/products">Products</a>
    <a href="/categories">Categories</a>
    <a href="/contact">Contact</a>

</nav>

<section class="contact-section">

    <h2>📞 Contact Us</h2>

    <div class="contact-box">

        <p><i class="fas fa-map-marker-alt"></i> Chennai, Tamil Nadu</p>

        <p><i class="fas fa-phone"></i> +91 9500637764</p>

        <p><i class="fas fa-envelope"></i> support@dkmart.com</p>

        <p><i class="fas fa-clock"></i> Mon - Sat : 9 AM - 8 PM</p>

    </div>

    <form class="contact-form" action="/contact" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Your Name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Your Email"
            required
        >

        <textarea
            name="message"
            rows="5"
            placeholder="Your Message"
            required
        ></textarea>

        <button type="submit">
            <i class="fas fa-paper-plane"></i> Send Message
        </button>

    </form>

</section>

</body>

</html>
