<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - DK MART</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header class="header">

    <div class="logo">
        <span class="dk">DK</span>
        <span class="mart">MART</span>
    </div>

    <div class="header-icons">
        <a href="/">Home</a>
        <a href="/products">Products</a>
        <a href="/cart">Cart</a>
    </div>

</header>

<nav class="navbar">
    <a href="/">Home</a>
    <a href="/products">Products</a>
    <a href="/categories">Categories</a>
    <a href="/contact">Contact</a>
</nav>

<section class="categories">

    <h2>🛍 Shop by Category</h2>

    <div class="category-container">

        <a href="/products?category=Mobile" class="category-card">
            <i class="fas fa-mobile-alt"></i>
            <h3>Mobiles</h3>
        </a>

        <a href="/products?category=Laptop" class="category-card">
            <i class="fas fa-laptop"></i>
            <h3>Laptops</h3>
        </a>

        <a href="/products?category=Headphone" class="category-card">
            <i class="fas fa-headphones"></i>
            <h3>Headphones</h3>
        </a>

        <a href="/products" class="category-card">
            <i class="fas fa-tv"></i>
            <h3>Electronics</h3>
        </a>

        <a href="/products" class="category-card">
            <i class="fas fa-clock"></i>
            <h3>Watches</h3>
        </a>

        <a href="/products" class="category-card">
            <i class="fas fa-couch"></i>
            <h3>Furniture</h3>
        </a>

    </div>

</section>

</body>
</html>
